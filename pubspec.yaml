name: base_app
description: "Flutter base app — BLoC + auto_route + get_it/injectable + Dio/Retrofit"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.9

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  freezed_annotation: ^3.1.0

  # Routing
  auto_route: ^11.1.0

  # Dependency Injection
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Network
  dio: ^5.9.2
  retrofit: ^4.9.2
  json_annotation: ^4.11.0

  # Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.1.0

  # Localization
  intl: ^0.20.2

  # Firebase
  firebase_core: ^3.15.2
  firebase_remote_config: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.14.1
  freezed: ^3.2.5
  auto_route_generator: ^10.5.0
  injectable_generator: ^3.0.2
  json_serializable: ^6.13.2
  retrofit_generator: ^10.2.6

  # Testing
  mocktail: ^1.0.5
  # bloc_test bị conflict với test_api 0.7.6 (pinned bởi Flutter 3.35.7 / Dart 3.9.2)
  # Upgrade Flutter lên version có Dart >=3.10.0 thì dùng lại được: bloc_test: ^10.0.0

  # Flavor
  flutter_flavorizr: ^2.4.2



flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
